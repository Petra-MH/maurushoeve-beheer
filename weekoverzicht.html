<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weekoverzicht</title><style>:root{--aub:#401216;--wine:#663137;--sand:#d7c4b7;--cream:#efe5d3}*{box-sizing:border-box}body{font:14px Montserrat,Arial,sans-serif;background:#f8f7f6;margin:0;color:#30282b;line-height:1.45}header{background:var(--aub);color:white;padding:17px 6%;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1100px;margin:25px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e4dcda;border-radius:9px;padding:22px;margin-bottom:18px}h1,h2{color:var(--aub)}h1{margin:0 0 15px}button{background:var(--aub);color:white;border:0;border-radius:5px;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#eee7e6;color:var(--aub)}input,select,textarea{font:inherit;border:1px solid #d7c4b7;border-radius:5px;padding:8px;max-width:100%}textarea{width:100%;min-height:76px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#663137}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:9px;text-align:left}th{background:var(--aub);color:white}.scroll{overflow:auto}.muted{color:#746969}.section{background:var(--wine);color:white;padding:9px 12px;margin:20px 0 14px;font-weight:bold}.tick{padding:8px 3px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}.tick input{width:18px;height:18px}#notice{background:#efe5d3;padding:12px;margin-bottom:15px}.printsheet{background:white;padding:16px}.small{font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{header,.no-print,#notice,.toolbar,button{display:none!important}body{background:white}main{max-width:none;margin:0;padding:0}.panel,.printsheet{border:0;padding:0;box-shadow:none}.section{print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:20px}textarea,input,select{border:0;resize:none} .grid{grid-template-columns:1fr 1fr} .tick{break-inside:avoid} @page{size:A4;margin:12mm}}.day{break-inside:avoid;margin:0 0 16px}.event{border:1px solid #e6d8d2;border-left:4px solid #663137;padding:10px 12px;margin:8px 0;break-inside:avoid;background:#fff}.event-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.event-time{margin-left:auto;font-weight:600}.tag{background:#efe5d3;color:#401216;font-weight:800;font-size:11px;padding:4px 7px;border-radius:4px}.event-sub{font-size:12px;color:#756969;margin-top:3px}.event-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 18px;margin-top:7px;font-size:12px}.event-details strong{color:#663137}.event-details .wide{grid-column:1/-1}.empty{margin:5px 0 12px}.section{margin-top:15px} @media print{.day{break-inside:auto}.event{padding:7px 9px}.event-details{font-size:10px}.section{padding:5px 9px;background:#663137!important;color:#fff!important}.panel{margin:0}#week{width:100%} .event{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style><header><strong>MAURUSHOEVE · WEEKOVERZICHT</strong><a href="index.html">Dashboard</a></header><main><h1>Weekoverzicht · Maurushoeve & catering</h1><div id="notice">Verbinding controleren…</div><div class="toolbar no-print"><label>Maandag <input id="monday" type="date"></label><button id="prev" class="secondary">Vorige week</button><button id="next" class="secondary">Volgende week</button><button onclick="window.print()">Afdrukken / PDF</button></div><section class="panel"><h2 id="period"></h2><div id="week"></div></section><section class="panel no-print"><h2>Interne activiteit toevoegen</h2><p class="muted">Kijkdagen, vergaderingen en interne afspraken die niet als project in Teamleader staan.</p><div class="grid"><div class="field"><label>Datum</label><input data-key="activity_date" type="date" required></div><div class="field"><label>Type</label><select data-key="category"><option>Kijkdag</option><option>Meeting</option><option>Intern</option><option>Andere</option></select></div><div class="field"><label>Naam / omschrijving</label><input data-key="title" placeholder="Bijv. kijkdag Maurushoeve"></div><div class="field"><label>Beginuur</label><input data-key="start_time" type="time"></div><div class="field"><label>Einduur</label><input data-key="end_time" type="time"></div><div class="field"><label>Begeleider</label><input data-key="owner_name"></div><div class="field"><label>Locatie</label><input data-key="location"></div><div class="field"><label>Aantal gasten</label><input data-key="guests"></div><div class="field full"><label>Opmerkingen</label><textarea data-key="notes"></textarea></div></div><div class="toolbar"><button id="add">Toevoegen</button></div></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;function message(s){$('notice').textContent=s}function todayISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function pretty(s){if(!s)return '—';let d=new Date(s+'T12:00:00');return isNaN(+d)?String(s):d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}async function connect(){let url=localStorage.getItem('mh_project_url'),key=localStorage.getItem('mh_publishable_key');if(!url||!key)throw Error('Stel eerst de Supabase-verbinding in via index.html');db=createClient(url,key);let {data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('Meld je eerst aan via het dashboard.')}async function get(t,q='*'){let {data,error}=await db.from(t).select(q);if(error)throw error;return data||[]}async function save(t,obj,conflict){let query=db.from(t).upsert(obj,conflict?{onConflict:conflict}:undefined);let {error}=await query;if(error)throw error}function field(label,v,name,type='text'){return `<div class="field"><label>${label}</label><input data-key="${name}" type="${type}" value="${esc(v)}"></div>`}function area(label,v,name){return `<div class="field"><label>${label}</label><textarea data-key="${name}">${esc(v)}</textarea></div>`}function readFields(){return Object.fromEntries([...document.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,x.value||null]))}
let events=[],items=[],deals=[],kijkdagen=[],preps=[],days=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];function monday(d){d=new Date(d+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return todayISO(d)}function move(n){let d=new Date($('monday').value+'T12:00:00');d.setDate(d.getDate()+n*7);$('monday').value=todayISO(d);render()}function strip(s){return String(s||'').slice(0,5)}
function render(){
 const start=new Date($('monday').value+'T12:00:00'),last=new Date(start);last.setDate(last.getDate()+6);
 const first=todayISO(start),end=todayISO(last);
 $('period').textContent=pretty(first)+' t.e.m. '+pretty(end);
 const all=[];
 for(const x of events){if(!x.event_date||x.event_date<first||x.event_date>end)continue;
 const p=preps.find(p=>p.event_id===String(x.id)||p.event_id===String(x.teamleader_projectnr));
 const dept=(x.department||p?.department||'').toLowerCase();
 const type=dept.includes('cater')?'CATERING':'MH';
 all.push({date:x.event_date,type,name:x.customer_name||x.title||'Project',title:x.title||'',time:strip(p?.event_start||x.start_time),owner:p?.weddingplanner||'',guests:p?.guests||'',concept:p?.concept||'',notes:[p?.special_notes,p?.remarks].filter(Boolean).join(' · '),project:x.teamleader_projectnr||''});
 }
 for(const x of kijkdagen){if(!x.appointment_at)continue;let day=x.appointment_at.slice(0,10);if(day<first||day>end)continue;
 let d=deals.find(d=>d.id===x.deal_id)||{};
 all.push({date:day,type:'KIJKDAG',name:d.customer_name||d.title||'Kijkdag',title:d.title||'',time:new Date(x.appointment_at).toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}),owner:x.guide||'',guests:d.guests||'',notes:x.notes||'',concept:d.event_type||''});
 }
 for(const x of items){if(x.activity_date<first||x.activity_date>end)continue;
 all.push({date:x.activity_date,type:(x.category||'Intern').toUpperCase(),name:x.title,time:[strip(x.start_time),strip(x.end_time)].filter(Boolean).join(' – '),owner:x.owner_name,guests:x.guests,notes:x.notes,location:x.location,id:x.id});
 }
 all.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)||a.type.localeCompare(b.type));
 $('week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const day=todayISO(d),rs=all.filter(x=>x.date===day);
 return `<div class="day"><div class="section">${pretty(day)}</div>${rs.length?rs.map(r=>`<article class="event"><div class="event-top"><span class="tag">${esc(r.type)}</span><b>${esc(r.name)}</b><span class="event-time">${esc(r.time||'')}</span>${r.id?`<button class="secondary no-print" data-delete="${r.id}">Verwijderen</button>`:''}</div>${r.title&&r.title!==r.name?`<div class="event-sub">${esc(r.title)}</div>`:''}<div class="event-details">${r.project?`<div><strong>Projectnr.</strong> ${esc(r.project)}</div>`:''}${r.guests?`<div><strong>Gasten</strong> ${esc(r.guests)}</div>`:''}${r.concept?`<div><strong>Concept / type</strong> ${esc(r.concept)}</div>`:''}${r.owner?`<div><strong>Begeleider / weddingplanner</strong> ${esc(r.owner)}</div>`:''}${r.location?`<div><strong>Locatie</strong> ${esc(r.location)}</div>`:''}${r.notes?`<div class="wide"><strong>Speciallekes / opmerkingen</strong> ${esc(r.notes)}</div>`:''}</div></article>`).join(''):'<p class="muted empty">Geen activiteiten</p>'}</div>`}).join('');
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Deze interne activiteit verwijderen?'))return;let {error}=await db.from('mh_weekitems').delete().eq('id',b.dataset.delete);if(error)message(error.message);else await load()});
}
async function getOptional(t){let {data,error}=await db.from(t).select('*').limit(5000);if(error){console.warn(t,error);return []}return data||[]}
async function load(){
 // Fetch projects in batches to avoid the default Supabase 1000-row limit.
 events=[];for(let off=0;off<10000;off+=1000){let {data,error}=await db.from('mh_events').select('*').range(off,off+999);if(error)throw error;events.push(...(data||[]));if(!data||data.length<1000)break}
 items=await getOptional('mh_weekitems');deals=await getOptional('mh_deals');kijkdagen=await getOptional('mh_kijkdagen');preps=await getOptional('mh_preparations');
 render();message('Weekoverzicht bijgewerkt. '+events.length+' projecten geladen.');
}
$('add').onclick=async()=>{try{let x=readFields();if(!x.activity_date||!x.title)throw Error('Datum en omschrijving zijn verplicht.');let {error}=await db.from('mh_weekitems').insert(x);if(error)throw error;document.querySelectorAll('[data-key]').forEach(x=>{if(x.tagName!=='SELECT')x.value=''});await load()}catch(e){message(e.message)}};$('monday').value=monday(todayISO(new Date()));$('monday').onchange=()=>{$('monday').value=monday($('monday').value);render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);try{await connect();await load()}catch(e){message(e.message)}</script></html>
