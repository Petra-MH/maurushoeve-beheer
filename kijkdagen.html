<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kijkdagfiches</title><style>:root{--aub:#401216;--wine:#663137;--sand:#d7c4b7;--cream:#efe5d3}*{box-sizing:border-box}body{font:14px Montserrat,Arial,sans-serif;background:#f8f7f6;margin:0;color:#30282b;line-height:1.45}header{background:var(--aub);color:white;padding:17px 6%;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1100px;margin:25px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e4dcda;border-radius:9px;padding:22px;margin-bottom:18px}h1,h2{color:var(--aub)}h1{margin:0 0 15px}button{background:var(--aub);color:white;border:0;border-radius:5px;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#eee7e6;color:var(--aub)}input,select,textarea{font:inherit;border:1px solid #d7c4b7;border-radius:5px;padding:8px;max-width:100%}textarea{width:100%;min-height:76px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#663137}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:9px;text-align:left}th{background:var(--aub);color:white}.scroll{overflow:auto}.muted{color:#746969}.section{background:var(--wine);color:white;padding:9px 12px;margin:20px 0 14px;font-weight:bold}.tick{padding:8px 3px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}.tick input{width:18px;height:18px}#notice{background:#efe5d3;padding:12px;margin-bottom:15px}.printsheet{background:white;padding:16px}.small{font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{header,.no-print,#notice,.toolbar,button{display:none!important}body{background:white}main{max-width:none;margin:0;padding:0}.panel,.printsheet{border:0;padding:0;box-shadow:none}.section{print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:20px}textarea,input,select{border:0;resize:none} .grid{grid-template-columns:1fr 1fr} .tick{break-inside:avoid} @page{size:A4;margin:12mm}}

</style><header><strong>MAURUSHOEVE · KIJKDAGEN</strong><a href="index.html">Dashboard</a></header><main><h1>Kijkdagfiches</h1><div id="notice">Verbinding controleren…</div><section class="panel no-print"><h2>Deals uit Teamleader</h2><p>Importeer een Excel- of CSV-export met dealnummer als unieke sleutel. Controleer de toewijzing; bestaande gespreksnotities worden niet overschreven.</p><input type="file" id="upload" accept=".xlsx,.xls,.csv"><div id="mapping"></div><div class="toolbar"><label>Filter <input id="filter" placeholder="Naam, nummer of fase"></label><button id="reload" class="secondary">Vernieuwen</button></div><div id="items" class="scroll"></div></section><section id="detail" class="panel prints heet" hidden></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;function message(s){$('notice').textContent=s}function todayISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function pretty(s){if(!s)return '—';let d=new Date(s+'T12:00:00');return isNaN(+d)?String(s):d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}async function connect(){let url=localStorage.getItem('mh_project_url'),key=localStorage.getItem('mh_publishable_key');if(!url||!key)throw Error('Stel eerst de Supabase-verbinding in via index.html');db=createClient(url,key);let {data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('Meld je eerst aan via het dashboard.')}async function get(t,q='*'){let all=[];for(let i=0;;i+=1000){let {data,error}=await db.from(t).select(q).order('id',{ascending:true}).range(i,i+999);if(error)throw error;all.push(...(data||[]));if(!data||data.length<1000)break}return all}async function save(t,obj,conflict){let query=db.from(t).upsert(obj,conflict?{onConflict:conflict}:undefined);let {error}=await query;if(error)throw error}function field(label,v,name,type='text'){return `<div class="field"><label>${label}</label><input data-key="${name}" type="${type}" value="${esc(v)}"></div>`}function area(label,v,name){return `<div class="field"><label>${label}</label><textarea data-key="${name}">${esc(v)}</textarea></div>`}function readFields(){return Object.fromEntries([...document.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,x.value||null]))}
let deals=[],notes=[],raw=[];const columns={teamleader_dealnr:['Nummer','dealnummer','deal nr'],title:['Titel'],customer_name:['Klant'],contact_person_import:['Contactpersoon'],contact_email_import:['Email contactpersoon'],customer_email:['Klant: E-mail'],customer_mobile:['Klant: Mobiel nummer'],event_type:['Type event'],event_date:['Datum event'],event_start:['Beginuur event'],event_end:['Einduur event'],guests:['Aantal personen'],location:['Adres event'],weddingplanner:['Weddingplanner'],deal_remarks:['Opmerkingen'],department:['Afdeling'],phase:['Fase'],pipeline:['Pipeline'],owner_name:['Verantwoordelijke'],source:['Herkomst'],date_added:['Datum toegevoegd'],project_reference:['Project'],amount_ex_vat:['Bedrag zonder btw'],refusal_reason:['Reden weigering'],refusal_details:['Reden weigering (lang)']};const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');function dateVal(v){if(v instanceof Date)return todayISO(v);if(typeof v==='number'&&v>30000&&v<80000)return todayISO(new Date(Date.UTC(1899,11,30)+v*86400000));let m=String(v??'').match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:/^\d{4}-\d{2}-\d{2}/.test(String(v))?String(v).slice(0,10):null}
async function reload(){deals=await get('mh_deals');notes=await get('mh_kijkdagen');list();message(deals.length+' deals beschikbaar.')}function list(){let q=$('filter').value.toLowerCase();let rs=deals.filter(d=>(q?([d.customer_name,d.teamleader_dealnr,d.phase,d.title].join(' ').toLowerCase().includes(q)):!['Geweigerd','Admin afgewerkt'].includes(d.phase)));rs.sort((a,b)=>(a.customer_name||'').localeCompare(b.customer_name||''));$('items').innerHTML=`<table><thead><tr><th>Deal</th><th>Klant</th><th>Event</th><th>Fase</th><th></th></tr></thead><tbody>${rs.map(d=>`<tr><td>${esc(d.teamleader_dealnr)}</td><td>${esc(d.customer_name)}</td><td>${esc(d.event_date||'')}</td><td>${esc(d.phase)}</td><td><button data-id="${d.id}">Fiche</button></td></tr>`).join('')}</tbody></table>`;$('items').querySelectorAll('button').forEach(x=>x.onclick=()=>show(Number(x.dataset.id)))}
function show(id){
 let d=deals.find(x=>x.id===id),n=notes.find(x=>x.deal_id===id)||{};
 const f=(label,value,key,type='text',wide=false)=>`<div class="${wide?'wide ':''}field"><label>${label}</label><input data-key="${key}" type="${type}" value="${esc(value??'')}"></div>`;
 const a=(label,value,key,extra='')=>`<div class="field ${extra}"><label>${label}</label><textarea data-key="${key}">${esc(value??'')}</textarea></div>`;
 const email=n.email||d.contact_email_import||d.customer_email||'';
 const person=n.contact_person||d.contact_person_import||'';
 const phone=n.phone||d.customer_mobile||'';
 const date=n.appointment_at?String(n.appointment_at).slice(0,16):'';
 $('detail').hidden=false;
 $('detail').innerHTML=`
 <div class="toolbar no-print"><button id="save">Fiche opslaan</button><button class="secondary" id="print">Afdrukken / PDF (2 pagina's)</button><span class="small muted">Voorzijde: gesprek · Verso: opvolging</span></div>
 <article class="sheet-page" id="sheet-front">

    ${f('Datum gesprek',date,'appointment_at','datetime-local')}${f('Begeleider MH',n.guide,'guide')}
    ${f('Type evenement',d.event_type,'_type')}${f('Aantal personen',d.guests,'_guests')}
    ${f('Datum evenement',d.event_date,'_date','date')}${f('Flexibiliteit',n.flexibility,'flexibility')}
    ${f('Budgetindicatie',n.budget,'budget')}
   </div>

   <div class="section compact-section">De vraag achter het feest</div>

    ${a('Gewenste sfeer',n.atmosphere,'atmosphere')}${a('Hun verhaal',n.story,'story')}
    ${a('Prioriteiten',n.priorities,'priorities')}${a('Twijfels / gevoeligheden',n.concerns,'concerns')}
   </div>
   <div class="sheet-meta">Kijkdag · Deal ${esc(d.teamleader_dealnr)} · 1 / 2</div>
 </article>
 <article class="sheet-page second-sheet" id="sheet-back">
   <div class="sheet-head"><h2>BESLUITVORMING & OPVOLGING</h2><small>MAURUSHOEVE</small></div>
   <div class="sheet-caption">${esc(d.customer_name||d.title)} · Deal ${esc(d.teamleader_dealnr)}</div>
   <div class="sheet-grid">
    ${f('Wie beslist?',n.decision_maker,'decision_maker')}${f('Wie is nog betrokken?',n.stakeholders,'stakeholders')}
    ${f('Gewenste beslisdatum',n.decision_date,'decision_date','date')}${f('Andere locaties / alternatieven',n.alternatives,'alternatives')}
   </div>
   <div class="section compact-section">Opmerkingen & verdere afspraken</div>
   ${a('Extra opmerkingen',n.followup_notes,'followup_notes')}
   <div class="section compact-section">To do klant</div>
   ${a('Acties voor de klant',n.todo_customer,'todo_customer','todo')}
   <div class="section compact-section">To do Maurushoeve</div>
   ${a('Acties voor MH',n.todo_mh,'todo_mh','todo')}
   <div class="sheet-meta">Kijkdag · Deal ${esc(d.teamleader_dealnr)} · 2 / 2</div>
 </article>`;
 document.querySelectorAll('[data-key^="_"]').forEach(x=>x.readOnly=true);
 $('print').onclick=()=>window.print();
 $('save').onclick=async()=>{try{
   let data=Object.fromEntries(Object.entries(readFields()).filter(([k])=>!k.startsWith('_')));
   if(data.appointment_at)data.appointment_at=new Date(data.appointment_at).toISOString();
   await save('mh_kijkdagen',{deal_id:id,...data},'deal_id');
   message('Kijkdagfiche opgeslagen in Supabase.');await reload();
 }catch(e){message('Opslaan mislukt: '+e.message)}};
 document.getElementById('detail').scrollIntoView({behavior:'smooth'});
}
$('upload').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let book=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});raw=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:'',raw:true});let heads=Object.keys(raw[0]||{});$('mapping').innerHTML='<h3>Controleer de Teamleader-kolommen</h3><div class="grid">'+Object.entries(columns).map(([key,names])=>{let found=heads.find(h=>names.some(n=>norm(n)===norm(h)))||'';return `<label class="field">${key}<select data-map="${key}"><option value="">— niet aanwezig —</option>${heads.map(h=>`<option value="${esc(h)}" ${h===found?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`}).join('')+'</div><div class="toolbar"><button id="import">Import controleren</button></div>';document.getElementById('import').onclick=async()=>{let map=Object.fromEntries([...document.querySelectorAll('[data-map]')].map(x=>[x.dataset.map,x.value]));if(!map.teamleader_dealnr)return message('Wijs eerst de kolom Nummer toe.');if(!map.title||!map.phase)return message('Kolommen Titel en Fase zijn verplicht.');let data=raw.map(r=>Object.fromEntries(Object.entries(map).filter(([k,v])=>v).map(([k,v])=>[k,['event_date','date_added'].includes(k)?dateVal(r[v]):k==='amount_ex_vat'?(r[v]===''||r[v]==null?null:Number(r[v])):String(r[v]??'').trim()||null]))).filter(x=>x.teamleader_dealnr);let unique=[...new Map(data.map(x=>[x.teamleader_dealnr,x])).values()];if(!confirm(`${unique.length} unieke deals importeren/bijwerken? Kijkdagnotities blijven behouden.`))return;let errors=[];for(let i=0;i<unique.length;i+=100){message('Importeren: '+Math.min(i+100,unique.length)+' / '+unique.length);let {error}=await db.from('mh_deals').upsert(unique.slice(i,i+100),{onConflict:'teamleader_dealnr'});if(error){errors.push('Rij '+(i+1)+': '+error.message);break}}if(errors.length){message('Import gestopt: '+errors.join('; '));return}await reload();message(unique.length+' deals succesvol verwerkt. Bestaande kijkdagnotities behouden.')}}catch(err){message('Bestand kon niet worden ingelezen: '+err.message)}};$('filter').oninput=list;$('reload').onclick=reload;try{await connect();await reload()}catch(e){message(e.message)}</script></html>
