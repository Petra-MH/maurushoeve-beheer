<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voorbereidingsfiches</title><style>:root{--aub:#401216;--wine:#663137;--sand:#d7c4b7;--cream:#efe5d3}*{box-sizing:border-box}body{font:14px Montserrat,Arial,sans-serif;background:#f8f7f6;margin:0;color:#30282b;line-height:1.45}header{background:var(--aub);color:white;padding:17px 6%;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1100px;margin:25px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e4dcda;border-radius:9px;padding:22px;margin-bottom:18px}h1,h2{color:var(--aub)}h1{margin:0 0 15px}button{background:var(--aub);color:white;border:0;border-radius:5px;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#eee7e6;color:var(--aub)}input,select,textarea{font:inherit;border:1px solid #d7c4b7;border-radius:5px;padding:8px;max-width:100%}textarea{width:100%;min-height:76px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:bold;color:#663137}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:9px;text-align:left}th{background:var(--aub);color:white}.scroll{overflow:auto}.muted{color:#746969}.section{background:var(--wine);color:white;padding:9px 12px;margin:20px 0 14px;font-weight:bold}.tick{padding:8px 3px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}.tick input{width:18px;height:18px}#notice{background:#efe5d3;padding:12px;margin-bottom:15px}.printsheet{background:white;padding:16px}.small{font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{header,.no-print,#notice,.toolbar,button{display:none!important}body{background:white}main{max-width:none;margin:0;padding:0}.panel,.printsheet{border:0;padding:0;box-shadow:none}.section{print-color-adjust:exact;-webkit-print-color-adjust:exact}h1{font-size:20px}textarea,input,select{border:0;resize:none} .grid{grid-template-columns:1fr 1fr} .tick{break-inside:avoid} @page{size:A4;margin:12mm}}</style><header><strong>MAURUSHOEVE · VOORBEREIDINGSFICHES</strong><a href="index.html">Dashboard</a></header><main><h1>Voorbereidingsfiches</h1><div id="notice">Verbinding controleren…</div><section class="panel no-print"><div class="toolbar"><label>Project <select id="project"></select></label><label>Soort fiche <select id="category"><option value="event">Maurushoeve event</option><option value="cat">Externe catering</option></select></label><button id="refresh" class="secondary">Vernieuwen</button></div></section><section id="fiche" class="panel" hidden></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;function message(s){$('notice').textContent=s}function todayISO(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function pretty(s){if(!s)return '—';let d=new Date(s+'T12:00:00');return isNaN(+d)?String(s):d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}async function connect(){let url=localStorage.getItem('mh_project_url'),key=localStorage.getItem('mh_publishable_key');if(!url||!key)throw Error('Stel eerst de Supabase-verbinding in via index.html');db=createClient(url,key);let {data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('Meld je eerst aan via het dashboard.')}async function get(t,q='*'){let {data,error}=await db.from(t).select(q);if(error)throw error;return data||[]}async function save(t,obj,conflict){let query=db.from(t).upsert(obj,conflict?{onConflict:conflict}:undefined);let {error}=await query;if(error)throw error}function field(label,v,name,type='text'){return `<div class="field"><label>${label}</label><input data-key="${name}" type="${type}" value="${esc(v)}"></div>`}function area(label,v,name){return `<div class="field"><label>${label}</label><textarea data-key="${name}">${esc(v)}</textarea></div>`}function readFields(){return Object.fromEntries([...document.querySelectorAll('[data-key]')].map(x=>[x.dataset.key,x.value||null]))}
let events=[],prepared=[],current=null;const base={aanmaak:['Kijkdagfiche verwerkt - relevante afspraken overgenomen in project','1e bespreking','2e bespreking','Tafelplan opgevraagd','Event-ID opgemaakt - planning, afspraken, leveranciers en taken'],vier:['Remindermail klant: definitief aantal personen, intoleranties en wijzigingen','Weekoverzicht MEP voorbereiden en kijkdagen toevoegen','Clipboard maken - documenten uit map halen'],twee:['Contact klant - aantallen, intoleranties en wijzigingen overlopen','Offerte en Event-ID aanpassen en eventuele update versturen','MEP-lijsten finaliseren en afdrukken','Bestellingen plaatsen','Leveranciers contacteren','Personeelsplanning controleren','Grondplannen opmaken','Clipboards controleren']};const catering={aanmaak:['Bespreking','Locatiebezoek'],vier:['Remindermail: definitieve aantallen, intoleranties en wijzigingen','Weekoverzicht MEP voorbereiden','Clipboard maken en praktische afspraken printen'],twee:['Contact klant - laatste afspraken','Offerte en event-ID controleren','MEP-lijsten in tweevoud afdrukken','Bestellingen plaatsen - leveranciers, dranken, materiaal','Clipboard controleren','Logistieke en cateringafspraken controleren']};function offset(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-n);return pretty(todayISO(d))}function render(){let e=current,n=prepared.find(x=>x.event_id===String(e.id))||{},isCat=$('category').value==='cat',tasks=isCat?catering:base;$('fiche').hidden=false;$('fiche').innerHTML=`<div class="toolbar no-print"><button id="save">Wijzigingen bewaren</button><button class="secondary" onclick="window.print()">Afdrukken / PDF</button></div><h1>VOORBEREIDINGSFICHE ${isCat?'CATERING':'EVENTS'}</h1><p><strong>${esc(e.customer_name)}</strong> · ${pretty(e.event_date)} · project #${esc(e.teamleader_projectnr||'')}</p><div class="section">EVENTGEGEVENS</div><div class="grid">${field('Projectcoördinator',n.coordinator,'coordinator')}${field('Eventcoördinator',n.eventco,'eventco')}${field('Concept',n.concept,'concept')}${field('Aantal gasten',n.guests,'guests')}${field('Beginuur',n.event_start,'event_start')}${field('Weddingplanner',n.weddingplanner,'weddingplanner')}${area('Bijzonderheden',n.special_notes,'special_notes')}${area('Opmerkingen',n.remarks,'remarks')}</div>${[['aanmaak','AANMAAK PROJECT'],['vier','4 WEKEN VOOR EVENT · '+offset(e.event_date,28)],['twee','2 WEKEN VOOR EVENT · '+offset(e.event_date,14)]].map(([k,heading])=>`<div class="section">${heading}</div>${tasks[k].map((t,i)=>`<label class="tick"><input data-check="${k}_${i}" type="checkbox" ${n.checks?.[k+'_'+i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}`).join('')}`;$('save').onclick=async()=>{try{let fields=readFields(),checks=Object.fromEntries([...document.querySelectorAll('[data-check]')].map(x=>[x.dataset.check,x.checked]));await save('mh_preparations',{event_id:String(e.id),...fields,checks},'event_id');message('Voorbereidingsfiche opgeslagen.');await refreshNotes();}catch(err){message('Bewaren mislukt: '+err.message)}}}async function refreshNotes(){prepared=await get('mh_preparations');}async function load(){events=(await get('mh_events','id,teamleader_projectnr,event_date,customer_name')).filter(x=>x.event_date).sort((a,b)=>a.event_date.localeCompare(b.event_date));await refreshNotes();$('project').innerHTML=events.map(x=>`<option value="${esc(x.id)}">${esc(x.customer_name)} · ${esc(x.event_date)} · #${esc(x.teamleader_projectnr)}</option>`).join('');if(events.length){current=events[0];render()}else message('Nog geen projecten in de database.')}$('project').onchange=()=>{current=events.find(x=>String(x.id)===$('project').value);render()};$('category').onchange=render;$('refresh').onclick=load;try{await connect();await load();message('Kies een project, vul de voorbereiding in en sla op.')}catch(e){message(e.message)}</script></html>
